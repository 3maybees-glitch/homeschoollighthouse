name: Fair Winds Weekly blog

on:
  schedule:
    # 10:00 UTC every Wednesday
    - cron: "0 10 * * 3"
  workflow_dispatch:
    inputs:
      week:
        description: "Optional ISO week key (e.g. 2026-W29). Defaults to current week."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate weekly blog post
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            node scripts/generate-weekly-blog.mjs --week "${{ github.event.inputs.week }}"
          else
            node scripts/generate-weekly-blog.mjs
          fi

      - name: Verify build
        run: npm run build

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/fair-winds-weekly
          delete-branch: true
          skip-if-no-changes: true
          title: "chore: Fair Winds Weekly blog dispatch"
          commit-message: "Add Fair Winds Weekly homeschool blog dispatch"
          body: |
            Automated weekly Fair Winds Weekly blog post.

            - Generated by `scripts/generate-weekly-blog.mjs`
            - `npm run build` passed in CI
            - Review content, then merge to deploy

            Triggered by: ${{ github.event_name }}
          labels: |
            blog
            automation
