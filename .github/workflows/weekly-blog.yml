name: Fair Winds Weekly blog

on:
  schedule:
    # 10:00 UTC every Wednesday
    - cron: "0 10 * * 3"
  workflow_dispatch:
    inputs:
      week:
        description: "Optional ISO week key (e.g. 2026-W29). Defaults to current week."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fair-winds-weekly
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate weekly blog post
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            node scripts/generate-weekly-blog.mjs --week "${{ github.event.inputs.week }}"
          else
            node scripts/generate-weekly-blog.mjs
          fi

      - name: Verify build
        run: npm run build

      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/blog-posts.json
          if git diff --staged --quiet; then
            echo "No new blog dispatch this week."
            exit 0
          fi
          git commit -m "Add Fair Winds Weekly homeschool blog dispatch"
          git push origin HEAD:main
